    <meta name="description" content="André Costa — Front-End Developer working with React and TypeScript. Explore web applications, game development and interactive experiences." />
    <meta name="theme-color" content="#101318" />
    <script>
      try {
        var preference = localStorage.getItem('portfolio-theme');
        document.documentElement.dataset.theme = preference === 'light' || preference === 'dark' ? preference : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (_) {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
    <meta name="author" content="André Costa" />
